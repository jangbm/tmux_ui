# Only used by the isolated preview server.
set -g mouse on
# Handle border drags in tmux before pane applications receive mouse events.
bind-key -T root MouseDrag1Border resize-pane -M
unbind-key -q -T root C-Space
# Explicit sequences can be mapped by Windows Terminal without that ambiguity.
set -s user-keys[0] "\e[96;5u"
set -s user-keys[1] "\e[96;6u"
bind-key -T root User0 run-shell -b 'TMW_SOCKET=#{b:socket_path} /home/jang/projects/tmux_ui/workspace/.venv/bin/python /home/jang/projects/tmux_ui/workspace/terminal-control.py "#{session_name}"'
bind-key -T root User1 run-shell -b 'TMW_SOCKET=#{b:socket_path} /home/jang/projects/tmux_ui/workspace/.venv/bin/python /home/jang/projects/tmux_ui/workspace/terminal-control.py "#{session_name}" --new'
bind-key -T root C-` run-shell -b 'TMW_SOCKET=#{b:socket_path} /home/jang/projects/tmux_ui/workspace/.venv/bin/python /home/jang/projects/tmux_ui/workspace/terminal-control.py "#{session_name}"'
bind-key -T root C-S-` run-shell -b 'TMW_SOCKET=#{b:socket_path} /home/jang/projects/tmux_ui/workspace/.venv/bin/python /home/jang/projects/tmux_ui/workspace/terminal-control.py "#{session_name}" --new'
# Prefix fallback works from any terminal emulator.
bind-key t run-shell -b 'TMW_SOCKET=#{b:socket_path} /home/jang/projects/tmux_ui/workspace/.venv/bin/python /home/jang/projects/tmux_ui/workspace/terminal-control.py "#{session_name}"'
set -g base-index 1
setw -g pane-base-index 1
set -g default-terminal 'tmux-256color'
set -sg escape-time 10
set -g history-limit 10000
set -as terminal-features ',xterm-256color:RGB'
set -g window-style 'bg=#181818,fg=#d6d6d6'
set -g window-active-style 'bg=#181818,fg=#d6d6d6'
set -g pane-border-style 'fg=#303030,bg=#181818'
set -g pane-active-border-style 'fg=#7e9582,bg=#181818'
set -g pane-border-lines simple
set -g status-style 'bg=#202020,fg=#a0a0a0'
set -g status-left-length 48
set -g status-left '#[fg=#a3bea8,bold] ◇ #[fg=#d6d6d6,nobold]#S #[fg=#414141]│ '
set -g status-right '#[fg=#a0a0a0] Ctrl+b d  detach  #[fg=#414141]│#[fg=#a3bea8]  local '
setw -g window-status-format '#{?@tmw_parked,, #I #W }'
setw -g window-status-current-style 'fg=#e8e8e8,bg=#303030'
setw -g window-status-current-format '#{?@tmw_parked,, #I #W }'
set -g window-status-separator ''
# tmux 3.6 misdetects horizontal drag borders with labels at the top.
set -g pane-border-status bottom
set -g pane-border-format '#[fg=#{?pane_active,#b7cdb9,#909090}]#{?#{==:#{@tmw_role},terminal-toolbar},, #{pane_title} }'
setw -g remain-on-exit on
